<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Mail — Secure Workspace</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz@0,6..72;1,6..72&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#14181d;        --paper:#f5f2ec;      --line:#d9d3c7;
    --muted:#6b6459;      --brand:#1f4b3f;      --brand-soft:#e5ede9;
    --block:#8a2018;      --block-soft:#f4e3e0; --allow:#1f4b3f;
    --amber:#a8721a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{max-width:940px;margin:0 auto;padding:0 24px 80px}

  /* Masthead */
  .mast{display:flex;align-items:baseline;justify-content:space-between;
        padding:26px 0 18px;border-bottom:2px solid var(--ink)}
  .brand{font-family:'Newsreader',serif;font-size:30px;font-weight:500;letter-spacing:-.01em}
  .brand em{font-style:italic;color:var(--brand)}
  .whoami{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
  .guard{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;
         font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);
       box-shadow:0 0 0 0 rgba(31,75,63,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,75,63,.45)}70%{box-shadow:0 0 0 7px rgba(31,75,63,0)}100%{box-shadow:0 0 0 0 rgba(31,75,63,0)}}

  /* Tabs */
  .tabs{display:flex;gap:2px;margin:26px 0 0}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.02em;
       padding:11px 20px;border:1px solid var(--line);border-bottom:none;background:#efeae1;
       color:var(--muted);cursor:pointer;transition:.15s}
  .tab.on{background:#fff;color:var(--ink);font-weight:500}
  .tab .n{color:var(--brand);margin-right:8px;font-weight:500}

  .panel{background:#fff;border:1px solid var(--line);padding:30px 32px}

  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;
        text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 7px}
  .field{margin-bottom:20px}
  input[type=text],textarea{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:15px;
        color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:0;
        padding:11px 13px;transition:.15s}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff}
  textarea{resize:vertical;min-height:150px;line-height:1.55}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  .hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px}
  .hint b{color:var(--amber);font-weight:500}

  .send{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.03em;
        text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;
        padding:14px 30px;cursor:pointer;transition:.15s}
  .send:hover{background:var(--brand)}
  .send:disabled{opacity:.5;cursor:wait}

  /* Drop zone */
  .drop{border:1.5px dashed var(--line);background:#fbfaf7;padding:38px 20px;text-align:center;
        cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop .big{font-family:'Newsreader',serif;font-size:19px;margin-bottom:5px}
  .drop .sm{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
  .chosen{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;
          display:flex;align-items:center;gap:9px;color:var(--ink)}
  .chosen .tag{background:var(--ink);color:var(--paper);padding:2px 8px;font-size:11px}

  /* Verdict reveal */
  .verdict{margin-top:24px;border:1px solid;padding:0;overflow:hidden;
           animation:drop .45s cubic-bezier(.16,1,.3,1)}
  @keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .verdict.block{border-color:var(--block);background:var(--block-soft)}
  .verdict.allow{border-color:var(--allow);background:var(--brand-soft)}
  .vhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;color:#fff}
  .verdict.block .vhead{background:var(--block)}
  .verdict.allow .vhead{background:var(--allow)}
  .vstate{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;
          text-transform:uppercase;letter-spacing:.1em}
  .vtime{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.8}
  .vbody{padding:18px 22px}
  .vline{font-family:'Newsreader',serif;font-size:17px;line-height:1.5;margin-bottom:14px}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;
        font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .meta dt{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding-top:1px}
  .meta dd{color:var(--ink)}
  .pill{display:inline-block;background:#fff;border:1px solid var(--line);
        padding:2px 8px;margin:0 5px 5px 0;font-size:11.5px}
  .pill.pii{border-color:var(--block);color:var(--block)}
  .foot{margin-top:40px;font-family:'IBM Plex Mono',monospace;font-size:11px;
        color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef} = React;

function Verdict({r,kind}){
  const blocked = r.blocked;
  return (
    <div className={"verdict "+(blocked?"block":"allow")}>
      <div className="vhead">
        <span className="vstate">{blocked?"◆ Transfer blocked":"✓ Transfer permitted"}</span>
        <span className="vtime">{r.elapsed}s · Sentry ASEAN</span>
      </div>
      <div className="vbody">
        <div className="vline">
          {blocked
            ? "This "+(kind==="email"?"message":"upload")+" was stopped before it left the network. It carries personal data bound for a jurisdiction without comparable protection under the PDPA."
            : "No transfer-limited personal data detected for this destination. The "+(kind==="email"?"message":"upload")+" was allowed to proceed."}
        </div>
        <dl className="meta">
          <dt>Destination</dt><dd>{r.jurisdiction||"—"}</dd>
          {r.clause && <><dt>PDPA basis</dt><dd>{r.clause}</dd></>}
          <dt>Data found</dt>
          <dd>{(r.pii_types&&r.pii_types.length)
                ? r.pii_types.map((t,i)=><span key={i} className="pill pii">{t}</span>)
                : <span className="pill">none</span>}</dd>
          <dt>Enforcement</dt>
          <dd>{kind==="email"
                ? (blocked?"SMTP session terminated — message never committed":"message delivered")
                : (blocked?"HTTP 403 — upload rejected mid-transfer":"HTTP "+r.status)}</dd>
        </dl>
      </div>
    </div>
  );
}

function EmailPanel(){
  const [to,setTo]=useState("partner@us-server");
  const [subject,setSubject]=useState("Q3 customer records");
  const [body,setBody]=useState("Hi,\n\nAttaching the account holder details you asked for:\nTan Ah Kow, NRIC S8234567A, +65 9123 4567.\n\nThanks");
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);
  async function send(){
    setBusy(true);setRes(null);
    try{
      const r=await fetch("/api/email",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({to,subject,body})});
      setRes(await r.json());
    }catch(e){setRes({blocked:true,error:"network",jurisdiction:"—",elapsed:0});}
    setBusy(false);
  }
  return (
    <div className="panel">
      <div className="row">
        <div className="field"><label>To</label>
          <input type="text" value={to} onChange={e=>setTo(e.target.value)}/>
          <div className="hint">try <b>@us-server</b> (blocked) or <b>@sg-server</b> (allowed)</div>
        </div>
        <div className="field"><label>Subject</label>
          <input type="text" value={subject} onChange={e=>setSubject(e.target.value)}/></div>
      </div>
      <div className="field"><label>Message</label>
        <textarea value={body} onChange={e=>setBody(e.target.value)}/></div>
      <button className="send" onClick={send} disabled={busy}>
        {busy?"Sending…":"Send message"}</button>
      {res && <Verdict r={res} kind="email"/>}
    </div>
  );
}

function UploadPanel(){
  const [file,setFile]=useState(null);
  const [over,setOver]=useState(false);
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);
  const inp=useRef();
  async function send(){
    if(!file)return;
    setBusy(true);setRes(null);
    const fd=new FormData();fd.append("file",file);
    try{
      const r=await fetch("/api/upload",{method:"POST",body:fd});
      setRes(await r.json());
    }catch(e){setRes({blocked:true,status:"network",jurisdiction:"US (non-equivalent)",elapsed:0});}
    setBusy(false);
  }
  return (
    <div className="panel">
      <div className={"drop"+(over?" over":"")}
        onClick={()=>inp.current.click()}
        onDragOver={e=>{e.preventDefault();setOver(true);}}
        onDragLeave={()=>setOver(false)}
        onDrop={e=>{e.preventDefault();setOver(false);if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);}}>
        <div className="big">Drop a file to transfer</div>
        <div className="sm">or click to browse · destination: us-server (US)</div>
        <input ref={inp} type="file" style={{display:"none"}}
          onChange={e=>setFile(e.target.files[0])}/>
      </div>
      {file && <div className="chosen"><span className="tag">FILE</span>{file.name}
        <span style={{color:"#6b6459"}}>· {(file.size/1024).toFixed(0)} KB</span></div>}
      <button className="send" style={{marginTop:20}} onClick={send} disabled={busy||!file}>
        {busy?"Transferring…":"Upload to US endpoint"}</button>
      {res && <Verdict r={res} kind="upload"/>}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("email");
  return (
    <div className="app">
      <div className="mast">
        <div>
          <div className="brand">Meridian <em>Mail</em></div>
          <div className="guard"><span className="dot"></span>Egress monitored · PDPA enforcement active</div>
        </div>
        <div className="whoami">staff@sentry.local<br/>workstation · 172.30.0.30</div>
      </div>
      <div className="tabs">
        <div className={"tab"+(tab==="email"?" on":"")} onClick={()=>setTab("email")}>
          <span className="n">01</span>Compose</div>
        <div className={"tab"+(tab==="upload"?" on":"")} onClick={()=>setTab("upload")}>
          <span className="n">02</span>File transfer</div>
      </div>
      {tab==="email"?<EmailPanel/>:<UploadPanel/>}
      <div className="foot">
        Meridian is a demonstration workspace. Every message and file leaving this workstation<br/>
        is inspected in transit by Project Sentry ASEAN before it reaches its destination.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
